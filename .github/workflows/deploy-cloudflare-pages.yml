name: Manual deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "اكتب deploy لتأكيد نشر النسخة الحالية"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-play-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manual confirmation
        shell: bash
        env:
          CONFIRM_DEPLOY: ${{ inputs.confirm_deploy }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_DEPLOY" != "deploy" ]]; then
            echo "::error::لم يتم النشر. اكتب deploy حرفيًا في حقل التأكيد."
            exit 1
          fi

      - name: Prepare and validate website files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public

          # Copy website files and folders recursively, including new pages and assets.
          # Exclude repository metadata, workflow definitions, build output, dependencies,
          # and environment files that may contain secrets.
          rsync -a ./ public/ \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/public/' \
            --exclude='/node_modules/' \
            --exclude='/.wrangler/' \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='**/.env' \
            --exclude='**/.env.*'

          for file in index.html play.html test.html; do
            if [[ ! -s "public/$file" ]]; then
              echo "::error::الملف الأساسي مفقود أو فارغ بعد تجهيز النشر: $file"
              exit 1
            fi
          done

          echo "Website files prepared for deployment:"
          find public -type f -printf '%P\\n' | sort

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=play --branch=main
